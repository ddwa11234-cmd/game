<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Catch - 2D Web Mini Game</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap');
        
        * {
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Responsive Canvas Container */
        .game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            border-radius: 1rem;
            background: linear-gradient(to bottom, #1a1c29, #0e1017);
        }

        /* Glassmorphism overlays */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-glow {
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }
        
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
        }

        .btn-glow:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 overflow-x-hidden">

    <!-- Top Header -->
    <header class="text-center my-2">
        <h1 class="text-3xl sm:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 tracking-wide">
            🎮 MONSTER CATCH
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">ขยับตะกร้าเก็บดวงดาว หลบหลีกระเบิด!</p>
    </header>

    <!-- Game Wrapper -->
    <main class="w-full max-w-lg flex flex-col items-center">
        <!-- Dashboard / Scoreboard -->
        <div class="w-full grid grid-cols-3 gap-2 sm:gap-4 mb-3">
            <div class="glass-panel rounded-xl p-2 sm:p-3 text-center">
                <span class="text-slate-400 text-xs block">คะแนนปัจจุบัน</span>
                <span id="scoreText" class="text-xl sm:text-2xl font-bold text-yellow-400">0</span>
            </div>
            <div class="glass-panel rounded-xl p-2 sm:p-3 text-center">
                <span class="text-slate-400 text-xs block">คะแนนสูงสุด</span>
                <span id="highScoreText" class="text-xl sm:text-2xl font-bold text-pink-400">0</span>
            </div>
            <div class="glass-panel rounded-xl p-2 sm:p-3 text-center">
                <span class="text-slate-400 text-xs block">พลังชีวิต</span>
                <span id="livesText" class="text-xl sm:text-2xl font-bold text-red-400">❤️❤️❤️</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="game-container w-full relative rounded-2xl overflow-hidden border border-slate-800">
            <canvas id="gameCanvas" class="w-full aspect-[4/5] sm:aspect-[4/5]"></canvas>

            <!-- Start / Game Over Overlay Screen -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center z-10 transition-opacity duration-300">
                <div class="text-5xl mb-3" id="overlayIcon">🌟</div>
                <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-extrabold text-white mb-2">พร้อมสนุกหรือยัง?</h2>
                <p id="overlayDesc" class="text-slate-300 text-sm mb-6 max-w-xs">
                    ลากตะกร้าไปรับ <span class="text-yellow-300">⭐️ ดาว</span> และ <span class="text-cyan-300">💎 เพชร</span> แต่ระวัง <span class="text-red-400">💣 ระเบิด</span> ด้วยล่ะ!
                </p>
                <button id="startBtn" class="btn-glow px-8 py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full font-bold text-lg text-white tracking-wider cursor-pointer">
                    เริ่มเล่นเกมเลย!
                </button>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div class="w-full flex justify-between items-center mt-4 gap-4 sm:hidden">
            <button id="leftBtn" class="glass-panel active:bg-pink-500/40 w-1/2 py-4 rounded-xl flex justify-center items-center text-2xl font-bold border border-slate-700">
                ⬅️ ซ้าย
            </button>
            <button id="rightBtn" class="glass-panel active:bg-pink-500/40 w-1/2 py-4 rounded-xl flex justify-center items-center text-2xl font-bold border border-slate-700">
                ขวา ➡️
            </button>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="mt-4 text-center text-xs text-slate-500">
        <p>💡 คำแนะนำ: บนคอมพิวเตอร์ใช้ปุ่มลูกศร <span class="text-slate-300">← / →</span> หรือลากเมาส์ขยับได้เลย</p>
    </footer>

    <!-- Game Logic JavaScript -->
    <script>
        // Game Engine Elements & Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Score UI Elements
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const livesText = document.getElementById('livesText');
        
        // Overlay Screen Elements
        const overlay = document.getElementById('overlay');
        const overlayIcon = document.getElementById('overlayIcon');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const startBtn = document.getElementById('startBtn');
        
        // Touch Control Buttons
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        // High Score Initialization
        let highScore = localStorage.getItem('monster_catch_highscore') || 0;
        highScoreText.textContent = highScore;

        // Set Logical Resolution (Internal coordinates)
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 500;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // Sound Effects Manager using Web Audio API
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playStarSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15); // A5
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playDiamondSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime); // E5
                osc.frequency.exponentialRampToValueAtTime(1318.51, this.ctx.currentTime + 0.2); // E6
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playBombSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sounds = new SoundFX();

        // Game State Vars
        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let animationFrameId = null;
        let spawnTimer = 0;
        let spawnInterval = 60; // Frames between spawns

        // Player (Basket) Object
        const player = {
            x: GAME_WIDTH / 2 - 35,
            y: GAME_HEIGHT - 50,
            width: 70,
            height: 20,
            speed: 7,
            dx: 0,
            color: '#ec4899',
            emoji: '📥'
        };

        // Falling Items Array
        let items = [];
        // Visual Particles Array
        let particles = [];

        // Input Control States
        const keys = {
            left: false,
            right: false
        };

        // Keyboard Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        // Mouse & Touch Dragging Support
        let isDragging = false;

        function handlePointerMove(e) {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = GAME_WIDTH / rect.width;
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            if (clientX !== undefined) {
                let canvasX = (clientX - rect.left) * scaleX;
                player.x = canvasX - player.width / 2;
                // Keep player within bounds
                if (player.x < 0) player.x = 0;
                if (player.x + player.width > GAME_WIDTH) player.x = GAME_WIDTH - player.width;
            }
        }

        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', (e) => {
            handlePointerMove(e);
            e.preventDefault();
        }, { passive: false });

        // Touch Control Buttons for Mobile UI
        leftBtn.addEventListener('touchstart', (e) => { keys.left = true; e.preventDefault(); });
        leftBtn.addEventListener('touchend', () => { keys.left = false; });
        rightBtn.addEventListener('touchstart', (e) => { keys.right = true; e.preventDefault(); });
        rightBtn.addEventListener('touchend', () => { keys.right = false; });

        // Item Spawner Utility Function
        function spawnItem() {
            const types = [
                { type: 'star', emoji: '⭐', points: 10, speed: Math.random() * 1.5 + 2, weight: 60 },
                { type: 'diamond', emoji: '💎', points: 30, speed: Math.random() * 2 + 3.5, weight: 20 },
                { type: 'bomb', emoji: '💣', points: -1, speed: Math.random() * 1.5 + 2.5, weight: 20 }
            ];

            // Weighted Random Selection
            let randomNum = Math.random() * 100;
            let selectedType = types[0];

            if (randomNum > 80) {
                selectedType = types[1]; // Diamond (20% chance)
            } else if (randomNum > 60) {
                selectedType = types[2]; // Bomb (20% chance)
            }

            const radius = 16;
            const x = Math.random() * (GAME_WIDTH - radius * 2) + radius;

            items.push({
                x: x,
                y: -20,
                radius: radius,
                type: selectedType.type,
                emoji: selectedType.emoji,
                points: selectedType.points,
                speed: selectedType.speed,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.05
            });
        }

        // Create Particle Effects on Catch
        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    life: 0.03
                });
            }
        }

        // Main Update Loop
        function update() {
            // Player Movement based on keyboard
            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            // Boundaries Check
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > GAME_WIDTH) player.x = GAME_WIDTH - player.width;

            // Spawning Logic
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnItem();
                spawnTimer = 0;
                // Gradually increase game speed over time
                if (spawnInterval > 25) spawnInterval -= 0.1;
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.rotation += item.rotSpeed;

                // Collision Check with Player (AABB & Radius overlap)
                if (
                    item.y + item.radius >= player.y &&
                    item.y - item.radius <= player.y + player.height &&
                    item.x + item.radius >= player.x &&
                    item.x - item.radius <= player.x + player.width
                ) {
                    // Collision Detected!
                    if (item.type === 'star') {
                        score += item.points;
                        sounds.playStarSound();
                        createParticles(item.x, item.y, '#facc15');
                    } else if (item.type === 'diamond') {
                        score += item.points;
                        sounds.playDiamondSound();
                        createParticles(item.x, item.y, '#22d3ee');
                    } else if (item.type === 'bomb') {
                        lives--;
                        sounds.playBombSound();
                        createParticles(item.x, item.y, '#f87171');
                        updateLivesUI();

                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }

                    scoreText.textContent = score;
                    items.splice(i, 1);
                    continue;
                }

                // Item Missed (Fell below screen)
                if (item.y - item.radius > GAME_HEIGHT) {
                    // If missed a star, lose life
                    if (item.type === 'star') {
                        lives--;
                        sounds.playBombSound();
                        updateLivesUI();
                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                    items.splice(i, 1);
                }
            }

            // Update Particle FX
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // Draw Everything
        function draw() {
            // Clear Canvas Background
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Draw Background Starry Details
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < 20; i++) {
                let starX = (i * 37) % GAME_WIDTH;
                let starY = (i * 53) % GAME_HEIGHT;
                ctx.fillRect(starX, starY, 2, 2);
            }

            // Draw Player Basket
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ec4899';
            ctx.fillStyle = player.color;
            
            // Rounded Rectangle for Basket
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 10);
            ctx.fill();

            // Basket Emoji Indicator
            ctx.shadowBlur = 0;
            ctx.font = '20px Kanit';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player.emoji, player.x + player.width / 2, player.y - 12);

            // Draw Falling Items
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.rotation);
                ctx.font = '26px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.emoji, 0, 0);
                ctx.restore();
            });

            // Draw Particle FX
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Main Game Loop
        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // UI Helpers
        function updateLivesUI() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            livesText.textContent = hearts || '💀';
        }

        function resetGame() {
            score = 0;
            lives = 3;
            spawnInterval = 60;
            spawnTimer = 0;
            items = [];
            particles = [];
            player.x = GAME_WIDTH / 2 - player.width / 2;
            scoreText.textContent = '0';
            updateLivesUI();
        }

        function startGame() {
            sounds.init();
            resetGame();
            isPlaying = true;
            overlay.classList.add('opacity-0', 'pointer-events-none');
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);

            // Check & Update High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('monster_catch_highscore', highScore);
                highScoreText.textContent = highScore;
                overlayIcon.textContent = '🏆';
                overlayTitle.textContent = 'สถิติใหม่!';
                overlayDesc.innerHTML = `ยินดีด้วย! คุณทำคะแนนสูงสุดใหม่ได้ <span class="text-yellow-400 font-bold">${score}</span> คะแนน!`;
            } else {
                overlayIcon.textContent = '💥';
                overlayTitle.textContent = 'จบเกม!';
                overlayDesc.innerHTML = `คุณทำคะแนนได้ <span class="text-yellow-400 font-bold">${score}</span> คะแนน<br>พยายามเข้า ลองอีกครั้งนะ!`;
            }

            startBtn.textContent = 'เล่นอีกครั้ง 🔄';
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Event Listener for Start Button
        startBtn.addEventListener('click', startGame);

        // Initial Background Render
        draw();
    </script>
</body>
</html>
